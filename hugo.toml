baseURL = "https://17310545446.github.io/personal_blog/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "Jiang 的博客"
theme = "PaperMod"
enableRobotsTXT = true
hasCJKLanguage = true          # 中文按字计数,阅读时间更准

# 构建行为
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

# ---------- 主题参数 ----------
[params]
  author = "JiangShengDong"
  description = "记录技术、折腾与思考"
  defaultTheme = "auto"          # 自动跟随系统深色/浅色
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = false
  ShowToc = true                 # 文章目录
  TocOpen = false

  # 首页简介区
  [params.homeInfoParams]
    Title = "你好,我是 Jiang 👋"
    Content = """
这里记录我的技术笔记、折腾日志和思考。
主要折腾:AI Agent、macOS 自动化、后端工程。
"""

  # 社交图标
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/17310545446"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  # 首页显示模式
  [params.profileMode]
    enabled = false

# ---------- 导航菜单 ----------
[[menu.main]]
  name = "文章"
  url = "/posts/"
  weight = 10
[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 20
[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 30
[[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 40
[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 50
